<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Water & Duurzaamheid Quiz</title>

<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: auto;
    padding: 20px;
    text-align: center;
    background: #e0f7fa;
  }

  h1 { animation: fadeIn 1s ease; }

  p {
    font-size: 18px;
    animation: fadeIn 0.5s ease;
  }

  button {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s;
  }

  button:hover { transform: scale(1.05); }

  .goed { background-color: #4CAF50; color: white; }
  .fout { background-color: #F44336; color: white; }

  #uitleg {
    margin-top: 15px;
    font-weight: bold;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>

<body>

<h1>💧 Water & Duurzaamheid</h1>
<p id="vraag"></p>
<div id="antwoorden"></div>
<p id="uitleg"></p>

<audio id="goed-geluid" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
<audio id="fout-geluid" src="https://actions.google.com/sounds/v1/cartoon/boing.ogg"></audio>
<audio id="gewonnen-geluid" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* ================== QUIZ VRAGEN ================== */
const quiz = [
  {
    vraag: "1. Hoeveel water op aarde is drinkbaar?",
    antwoorden: ["70%", "10%", "Minder dan 1%", "25%"],
    goed: 2,
    uitleg: "Het meeste water op aarde is zout; minder dan 1% is direct drinkbaar."
  },
  {
    vraag: "2. Wat zijn gevolgen van de stijgende zeespiegel?",
    antwoorden: [
      "Meer drinkwater",
      "Overstromingen en verlies van land",
      "Schonere oceanen",
      "Lagere temperaturen"
    ],
    goed: 1,
    uitleg: "Door klimaatverandering stijgt de zee en lopen laaggelegen gebieden onder."
  },
  {
    vraag: "3. Hoe raken rivieren vervuild?",
    antwoorden: [
      "Alleen door regen",
      "Door industrie, afval en landbouw",
      "Door vissen",
      "Door zonlicht"
    ],
    goed: 1,
    uitleg: "Afval en bestrijdingsmiddelen vervuilen rivieren."
  },
  {
    vraag: "4. Hoeveel procent van de wereldbevolking heeft een tekort aan drinkwater?",
    antwoorden: ["5%", "15%", "25%", "Ongeveer 30%"],
    goed: 3,
    uitleg: "Ongeveer 1 op de 3 mensen heeft geen veilige toegang tot drinkwater."
  },
  {
    vraag: "5. Hoeveel liter drinkwater gebruikt de gemiddelde Nederlander per dag?",
    antwoorden: ["50 liter", "80 liter", "130 liter", "300 liter"],
    goed: 2,
    uitleg: "Gemiddeld gebruikt een Nederlander ongeveer 130 liter per dag."
  },
  {
    vraag: "6. Hoeveel liter water gebruik je tijdens tandenpoetsen met open kraan?",
    antwoorden: ["1 liter", "5 liter", "Ongeveer 15 liter", "Meer dan 30 liter"],
    goed: 2,
    uitleg: "Door de kraan dicht te doen bespaar je veel water."
  },
  {
    vraag: "7. Hoe is drinkwater verdeeld op aarde?",
    antwoorden: [
      "Iedereen heeft evenveel",
      "Meer dan genoeg voor iedereen",
      "Ongelijk verdeeld en vaak te weinig",
      "10.000 liter per dag"
    ],
    goed: 2,
    uitleg: "Sommige gebieden hebben grote tekorten, andere veel water."
  },
  {
    vraag: "8. Hoeveel liter water kost één keer toilet doorspoelen?",
    antwoorden: ["2 liter", "4 liter", "6 tot 9 liter", "20 liter"],
    goed: 2,
    uitleg: "Moderne toiletten gebruiken 6 tot 9 liter per spoelbeurt."
  },
  {
    vraag: "9. Wat bespaart het meeste water in huis?",
    antwoorden: ["Lichten uitdoen", "Korter douchen", "TV uitzetten", "Ramen sluiten"],
    goed: 1,
    uitleg: "Korter douchen bespaart tientallen liters per keer."
  },
  {
    vraag: "10. Waarom is water besparen belangrijk?",
    antwoorden: [
      "Water raakt altijd op",
      "Schoon drinkwater is schaars",
      "Alleen om geld te besparen",
      "Alleen voor fabrieken"
    ],
    goed: 1,
    uitleg: "Schoon drinkwater is waardevol en niet onbeperkt."
  }
];

/* ================== LOGICA ================== */
let huidigeVraag = 0;

function vandaag() {
  return new Date().toISOString().split("T")[0];
}

function checkDagReset() {
  const opgeslagenDag = localStorage.getItem("quiz_dag");
  if (opgeslagenDag !== vandaag()) {
    localStorage.setItem("quiz_dag", vandaag());
    localStorage.setItem("winnaars_vandaag", "0");
  }
}

checkDagReset();

function toonVraag() {
  document.getElementById("uitleg").innerText = "";
  document.getElementById("vraag").innerText = quiz[huidigeVraag].vraag;
  const container = document.getElementById("antwoorden");
  container.innerHTML = "";

  quiz[huidigeVraag].antwoorden.forEach((tekst, index) => {
    const knop = document.createElement("button");
    knop.innerText = tekst;
    knop.onclick = () => checkAntwoord(index, knop);
    container.appendChild(knop);
  });
}

function checkAntwoord(index, knop) {
  document.querySelectorAll("button").forEach(b => b.disabled = true);

  if (index === quiz[huidigeVraag].goed) {
    knop.classList.add("goed");
    document.getElementById("goed-geluid").play();
  } else {
    knop.classList.add("fout");
    document.getElementById("fout-geluid").play();
  }

  document.getElementById("uitleg").innerText = quiz[huidigeVraag].uitleg;

  setTimeout(() => {
    huidigeVraag++;
    huidigeVraag < quiz.length ? toonVraag() : eindeQuiz();
  }, 2000);
}

function eindeQuiz() {
  checkDagReset();

  let winnaars = parseInt(localStorage.getItem("winnaars_vandaag")) || 0;
  const gewonnen = Math.floor(Math.random() * 250) === 0 && winnaars < 5;

  if (gewonnen) {
    winnaars++;
    localStorage.setItem("winnaars_vandaag", winnaars.toString());
    document.getElementById("gewonnen-geluid").play();
    confettiEffect();
    document.body.innerHTML = `
      <h1>🎉 GEFELICITEERD!</h1>
      <h2>Je hebt een prijs gewonnen!</h2>
      <p>Meld je bij de receptie 💧</p>
    `;
  } else {
    document.body.innerHTML = `
      <h1>Dank je wel!</h1>
      <p>Je hebt nu meer geleerd over water en duurzaamheid.</p>
      <p>Elke druppel telt 💧</p>
    `;
  }
}

function confettiEffect() {
  const eind = Date.now() + 4000;
  (function frame() {
    confetti({
      particleCount: 40,
      spread: 360,
      origin: { x: Math.random(), y: Math.random() - 0.2 }
    });
    if (Date.now() < eind) requestAnimationFrame(frame);
  })();
}

toonVraag();
</script>

</body>
</html>
