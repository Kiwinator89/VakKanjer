<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Water & Duurzaamheid Quiz</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: auto;
    padding: 20px;
    text-align: center;
    background: #e0f7fa;
    transition: background 0.5s;
  }
  h1 {
    animation: fadeIn 1s ease;
  }
  p {
    font-size: 18px;
    animation: fadeIn 1s ease;
  }
  button {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  .goed { background-color: #4CAF50; color: white; }
  .fout { background-color: #F44336; color: white; }
  @keyframes fadeIn {
    from {opacity:0;}
    to {opacity:1;}
  }
  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-15px); }
    60% { transform: translateY(-8px); }
  }
  .bounce {
    animation: bounce 0.5s;
  }
  #confetti-canvas {
    position: fixed;
    top:0;
    left:0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
  }
</style>
</head>

<body>

<h1>💧 Water & Duurzaamheid</h1>
<p id="vraag"></p>
<div id="antwoorden"></div>

<audio id="goed-geluid" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
<audio id="fout-geluid" src="https://actions.google.com/sounds/v1/cartoon/boing.ogg"></audio>
<audio id="gewonnen-geluid" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"></audio>

<canvas id="confetti-canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const quiz = [
  {
    vraag: "1. Hoeveel water op aarde is drinkbaar?",
    antwoorden: ["70%", "10%", "Minder dan 1%", "25%"],
    goed: 2
  },
  {
    vraag: "2. Wat zijn gevolgen van de stijgende zeespiegel?",
    antwoorden: [
      "Meer drinkwater",
      "Overstromingen en verlies van land",
      "Schonere oceanen",
      "Lagere temperaturen"
    ],
    goed: 1
  },
  {
    vraag: "3. Hoe raken rivieren vervuild?",
    antwoorden: [
      "Alleen door regen",
      "Door industrie, afval en landbouw",
      "Door vissen",
      "Door zonlicht"
    ],
    goed: 1
  },
  {
    vraag: "4. Hoeveel procent van de wereldbevolking heeft een tekort aan drinkwater?",
    antwoorden: ["5%", "15%", "25%", "Ongeveer 30%"],
    goed: 3
  },
  {
    vraag: "5. Hoeveel liter drinkwater gebruikt de gemiddelde Nederlander per dag?",
    antwoorden: ["50 liter", "80 liter", "130 liter", "300 liter"],
    goed: 2
  }
];

let huidigeVraag = 0;

const goedGeluid = document.getElementById("goed-geluid");
const foutGeluid = document.getElementById("fout-geluid");
const gewonnenGeluid = document.getElementById("gewonnen-geluid");

function toonVraag() {
  document.getElementById("vraag").innerText = quiz[huidigeVraag].vraag;
  const container = document.getElementById("antwoorden");
  container.innerHTML = "";

  quiz[huidigeVraag].antwoorden.forEach((tekst, index) => {
    const knop = document.createElement("button");
    knop.innerText = tekst;
    knop.onclick = () => checkAntwoord(index, knop);
    container.appendChild(knop);
  });
}

function checkAntwoord(index, knop) {
  const juiste = quiz[huidigeVraag].goed;

  if (index === juiste) {
    knop.classList.add("goed", "bounce");
    goedGeluid.play();
  } else {
    knop.classList.add("fout", "bounce");
    foutGeluid.play();
  }

  setTimeout(() => {
    huidigeVraag++;
    if (huidigeVraag < quiz.length) {
      toonVraag();
    } else {
      eindeQuiz();
    }
  }, 800);
}

function eindeQuiz() {
  const gewonnen = Math.floor(Math.random() * 250) === 0;

  if (gewonnen) {
    gewonnenGeluid.play();
    document.body.innerHTML = `
      <h1>🎉 GEFELICITEERD!</h1>
      <h2>JE HEBT EEN PRIJS GEWONNEN!</h2>
      <p>Dank je dat je bewust bezig bent met water! Je kunt je prijs ophalen bij de receptie! 💧</p>
    `;
    confettiEffect();
  } else {
    document.body.innerHTML = `
      <h1>Dank je wel!</h1>
      <p>Je hebt nu meer geleerd over water en duurzaamheid.</p>
      <p>Elke druppel telt 💧</p>
    `;
  }
}

function confettiEffect() {
  const duration = 5 * 1000;
  const animationEnd = Date.now() + duration;
  const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

  function frame() {
    const timeLeft = animationEnd - Date.now();
    if (timeLeft <= 0) return;
    const particleCount = 50 * (timeLeft / duration);
    confetti({...defaults, particleCount, origin: { x: Math.random(), y: Math.random() - 0.2 }});
    requestAnimationFrame(frame);
  }
  frame();
}

toonVraag();
</script>

</body>
</html>
